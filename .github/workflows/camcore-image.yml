name: Build CamCore Beszel image

on:
  push:
    branches:
      - main
    paths:
      - "internal/site/**"
      - "internal/dockerfile_hub"
      - ".github/workflows/camcore-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: camcore-beszel-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official CamCore assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p internal/site/public/static
          curl -fsSL \
            https://raw.githubusercontent.com/camcoreau/Seerr/develop/public/logo_full.svg \
            -o internal/site/public/static/camcore-logo.svg
          curl -fsSL \
            https://raw.githubusercontent.com/camcoreau/Seerr/develop/public/os_icon.svg \
            -o internal/site/public/static/camcore-icon.svg
          curl -fsSL \
            https://raw.githubusercontent.com/camcoreau/it-tools/main/public/camcore-icon.png \
            -o internal/site/public/static/camcore-icon.png

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --no-save --cwd ./internal/site

      - name: Build frontend
        run: bun run --cwd ./internal/site build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/camcoreau/beszel
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./internal/dockerfile_hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
